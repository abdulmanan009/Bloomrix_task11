<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Profile - Dynamic</title>
  <style>
    /* Base styles from earlier training */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #333;
      background: #f4f4f4;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    header {
      background: #2c3e50;
      color: #fff;
      padding: 30px;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 5px;
    }

    header p {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .profile-section {
      padding: 30px;
      border-bottom: 1px solid #eee;
    }

    .profile-section:last-child {
      border-bottom: none;
    }

    h2 {
      color: #2c3e50;
      margin-bottom: 15px;
      border-bottom: 2px solid #3498db;
      padding-bottom: 5px;
      display: inline-block;
    }

    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      list-style: none;
      margin-top: 10px;
    }

    .skills-list li {
      background: #3498db;
      color: #fff;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.9rem;
    }

    .project-card {
      background: #f9f9f9;
      border-left: 4px solid #3498db;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 0 5px 5px 0;
    }

    .project-card h3 {
      color: #2c3e50;
      margin-bottom: 5px;
    }

    .project-card p {
      color: #666;
      font-size: 0.95rem;
    }

    .contact-info p {
      margin-bottom: 5px;
    }

    .contact-info a {
      color: #3498db;
      text-decoration: none;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }

    .search-box {
      margin: 20px 0;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-box input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 1rem;
      min-width: 200px;
    }

    .search-box button {
      padding: 10px 20px;
      background: #3498db;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
    }

    .search-box button:hover {
      background: #2980b9;
    }

    .score-display {
      background: #e8f4fd;
      padding: 15px;
      border-radius: 5px;
      margin-top: 15px;
      font-weight: bold;
      color: #2c3e50;
    }

    .error-message {
      background: #fde8e8;
      color: #c0392b;
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
      display: none;
    }

    .no-results {
      color: #e74c3c;
      font-style: italic;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #2c3e50;
      color: #fff;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="profile-name">Loading...</h1>
      <p id="profile-role"></p>
    </header>

    <section class="profile-section" id="about-section">
      <h2>About</h2>
      <p id="profile-bio"></p>
    </section>

    <section class="profile-section" id="skills-section">
      <h2>Skills</h2>
      <div class="search-box">
        <input type="text" id="skill-search" placeholder="Search skills..." aria-label="Search skills">
        <button id="search-btn">Search</button>
        <button id="clear-btn">Clear</button>
      </div>
      <ul class="skills-list" id="skills-list"></ul>
      <p class="no-results" id="no-results" style="display: none;">No skills match your search.</p>
      <div class="score-display" id="skill-score"></div>
    </section>

    <section class="profile-section" id="experience-section">
      <h2>Experience</h2>
      <div id="experience-list"></div>
    </section>

    <section class="profile-section" id="projects-section">
      <h2>Projects</h2>
      <div id="projects-list"></div>
    </section>

    <section class="profile-section" id="education-section">
      <h2>Education</h2>
      <div id="education-list"></div>
    </section>

    <section class="profile-section" id="contact-section">
      <h2>Contact</h2>
      <div class="contact-info" id="contact-info"></div>
    </section>

    <div class="error-message" id="error-message"></div>

    <footer>
      <p>&copy; 2025 Personal Profile. Built with HTML, CSS, and JavaScript.</p>
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
